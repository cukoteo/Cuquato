<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CTEOW - Thông tin cá nhân</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111827, #020617);
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .avatar {
      width: 100px;
      height: 100px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #00e5ff, #7c3aed);
      font-size: 38px;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
    }

    h1 {
      margin-top: 20px;
      font-size: 30px;
    }

    .bio {
      margin-top: 10px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .info {
      margin-top: 25px;
      text-align: left;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      margin-top: 12px;
      background: rgba(255,255,255,0.07);
      border-radius: 15px;
    }

    .icon {
      font-size: 22px;
    }

    .item span {
      color: #94a3b8;
      font-size: 13px;
    }

    .item strong {
      display: block;
      margin-top: 3px;
      font-size: 16px;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .call {
      background: #22c55e;
      color: white;
    }

    .copy {
      background: #334155;
      color: white;
      border: none;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    footer {
      margin-top: 25px;
      color: #64748b;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="avatar">C</div>

    <h1>CTEOW</h1>

    <p class="bio">
      Xin chào! Mình là CTEOW 👋<br>
      Đây là trang thông tin cá nhân của mình.
    </p>

    <div class="info">

      <div class="item">
        <div class="icon">👤</div>
        <div>
          <span>Tên</span>
          <strong>CTEOW</strong>
        </div>
      </div>

      <div class="item">
        <div class="icon">📱</div>
        <div>
          <span>Số điện thoại</span>
          <strong>0583516778</strong>
        </div>
      </div>

    </div>

    <div class="buttons">

      <a class="btn call" href="tel:0583516778">
        📞 Gọi ngay
      </a>

      <button class="btn copy" onclick="copyPhone()">
        📋 Sao chép
      </button>

    </div>

    <footer>
      © 2026 CTEOW
    </footer>

  </div>

  <script>
    function copyPhone() {
      navigator.clipboard.writeText("0583516778");
      alert("Đã sao chép số điện thoại!");
    }
  </script>

</body>
</html>
